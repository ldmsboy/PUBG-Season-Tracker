<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Season Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Teko:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'pubg-bg-dark': 'var(--pubg-bg-dark)',
                        'pubg-bg-light': 'var(--pubg-bg-light)',
                        'pubg-yellow': 'var(--pubg-yellow)',
                        'pubg-text-light': 'var(--pubg-text-light)',
                        'pubg-text-dark': 'var(--pubg-text-dark)',
                        'pubg-red-alert': 'var(--pubg-red-alert)',
                    },
                    fontFamily: {
                        'heading': ['Teko', 'sans-serif'],
                        'body': ['Roboto Condensed', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="flex flex-col font-body bg-pubg-bg-dark text-pubg-text-light">
    <header class="bg-pubg-bg-light/90 sticky top-0 z-50 border-b border-pubg-yellow/20">
        <div class="container mx-auto flex justify-between items-center px-6 py-4">
            <div class="flex items-center space-x-3">
                <span class="bg-pubg-red-alert text-white px-3 py-1 rounded-md text-xs font-bold">
                    LIVE
                </span>
                <h1 class="text-2xl font-heading text-white tracking-wider">PUBG Season Tracker</h1>
            </div>
            <button id="toggle-ads-btn" 
                    class="bg-pubg-yellow text-pubg-text-dark font-bold hover:bg-yellow-400 
                           rounded-md px-3 py-1 text-xs transition-colors whitespace-nowrap">
                Toggle Ads
            </button>
        </div>
    </header>

    <main class="flex-grow container mx-auto p-4 lg:p-8 flex flex-col lg:flex-row gap-6 max-w-7xl">
        <aside class="ad-container w-72 flex-shrink-0 hidden lg:block">
            <div class="bg-pubg-bg-light rounded-xl p-4 sticky top-24">
                <!-- AdSense Ad - Left Sidebar -->
                <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3375516634263180"
                     crossorigin="anonymous"></script>
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-format="autorelaxed"
                     data-ad-client="ca-pub-3375516634263180"
                     data-ad-slot="9611884878"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </aside>

        <div class="w-full lg:flex-grow space-y-8">
            <div class="bg-pubg-bg-light/75 rounded-xl p-8 text-center">
                <h2 id="season-title" class="text-4xl font-heading text-white mb-6">Loading season...</h2>
                <div id="timer" class="font-heading text-6xl lg:text-7xl text-pubg-yellow mb-3 tracking-tight">00:00:00:00</div>
                <p id="timer-subtitle" class="text-lg text-pubg-text-light/80 font-medium">Loading...</p>
            </div>

            <div class="bg-pubg-bg-light/75 rounded-xl p-8">
                <div class="mb-4 flex justify-between items-center">
                    <span class="text-pubg-text-light/80 font-medium">Season Progress</span>
                    <span id="progress-percent" class="text-pubg-yellow font-bold text-lg">0%</span>
                </div>
                <div class="bg-pubg-bg-dark rounded-md h-3 overflow-hidden">
                    <div id="progress-bar" class="bg-pubg-yellow h-full w-0 transition-all duration-500"></div>
                </div>
                <div id="date-info" class="mt-6 text-sm text-pubg-text-light/60 text-center font-medium leading-relaxed">
                    Loading dates...
                </div>
            </div>

            <div class="bg-pubg-bg-light/75 rounded-xl p-6 text-center">
                <span class="inline-flex items-center px-4 py-2 rounded-md border border-pubg-yellow/20 text-sm font-medium text-pubg-text-light/80">
                    <span class="w-2 h-2 bg-pubg-red-alert rounded-full mr-2 animate-pulse"></span>
                    Live Updates
                </span>
            </div>
        </div>

        <aside class="ad-container w-72 flex-shrink-0 hidden lg:block">
            <div class="bg-pubg-bg-light rounded-xl p-4 sticky top-24">
                <!-- AdSense Ad - Right Sidebar -->
                <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3375516634263180"
                     crossorigin="anonymous"></script>
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-format="autorelaxed"
                     data-ad-client="ca-pub-3375516634263180"
                     data-ad-slot="9611884878"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </aside>
    </main>

    <!-- Mobile Ad Banner -->
    <div class="ad-container w-full block lg:hidden my-4 px-4">
        <div class="bg-pubg-bg-light rounded-xl p-4 mx-auto" style="max-width: 320px;">
            <!-- AdSense Ad - Mobile -->
            <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3375516634263180"
                 crossorigin="anonymous"></script>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-format="autorelaxed"
                 data-ad-client="ca-pub-3375516634263180"
                 data-ad-slot="9611884878"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>

    <footer class="bg-pubg-bg-light/75 mt-8 text-center py-6 text-pubg-text-light/40 text-sm font-medium">
        <p>&copy; 2025 PUBG Season Tracker &middot; Not affiliated with PUBG Corp.</p>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
